[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "muwasa-retrieval-engine"
version = "0.1.0"
description = "Hybrid retrieval engine for Muwasa Islamic support companion"
authors = ["Fuayd <fuayd@example.com>"]

[tool.poetry.dependencies]
python = "^3.10"
asyncpg = "^0.29.0"
numpy = "^1.26.0"
openai = "^1.12.0"
httpx = "^0.27.0"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.8.0"
