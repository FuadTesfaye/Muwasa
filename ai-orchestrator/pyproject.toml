[project]
name = "muwasa-ai-orchestrator"
version = "0.1.0"
description = "AI Orchestrator for Muwasa - Islamic emotional-support companion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.3",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "pgvector>=0.2.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
