services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: muwasa
      POSTGRES_USER: muwasa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muwasa_dev_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muwasa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: valkey-server --maxmemory-policy noeviction --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
